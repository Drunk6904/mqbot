<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mqbot 控制中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link href="static/style.css" rel="stylesheet" />
</head>

<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="header">
      <div class="header__logo">M</div>
      <span class="header__title">mqbot 控制中心</span>
      <div class="header__sep"></div>
      <div class="header__status">
        <span class="header__dot" id="wsDot"></span>
        <span id="wsLabel">未连接</span>
      </div>
    </header>

    <!-- 主体 -->
    <div class="main">
      <!-- 画布 -->
      <div class="canvas-area">
        <canvas id="map"></canvas>
        <div class="canvas-info" id="canvasInfo">移动鼠标查看坐标</div>
      </div>

      <!-- 侧边栏 -->
      <div class="sidebar">
        <!-- 机器人列表 -->
        <div class="robot-list">
          <div class="robot-list__title">Robots</div>
          <div id="robotCards">
            <div class="robot-list__empty">等待机器人连接...</div>
          </div>
        </div>

        <!-- 任务下发 -->
        <div class="task-form">
          <div class="task-form__title">Task Dispatch</div>
          <div class="form-selected" id="selectedInfo">点击列表选择机器人</div>
          <div class="form-row">
            <div>
              <div class="form-label">X</div>
              <input class="form-input" id="targetX" type="number" step="0.1" placeholder="0.0">
            </div>
            <div>
              <div class="form-label">Y</div>
              <input class="form-input" id="targetY" type="number" step="0.1" placeholder="0.0">
            </div>
          </div>
          <button class="btn-send" id="btnSend" disabled>发送移动指令</button>
        </div>
      </div>
    </div>
  </div>

  <script src="static/script.js"></script>
</body>

</html>
